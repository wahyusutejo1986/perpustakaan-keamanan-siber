<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#021a36" />
    </linearGradient>

    <!-- Neon Cyan to Blue Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Indonesian Red Accent Gradient -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.6" />
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />
  <rect width="1200" height="400" fill="url(#cyberGrid)" />

  <!-- Abstract Cyber Accents (Left & Right) -->
  <circle cx="100" cy="80" r="150" fill="#0284c7" opacity="0.12" filter="url(#glow)" />
  <circle cx="1100" cy="320" r="180" fill="#2563eb" opacity="0.12" filter="url(#glow)" />

  <!-- Circuit Lines decorative -->
  <path d="M 50 350 L 220 350 L 280 290 L 400 290" fill="none" stroke="#0ea5e9" stroke-width="2" opacity="0.3" />
  <circle cx="400" cy="290" r="4" fill="#38bdf8" />
  
  <path d="M 1150 50 L 980 50 L 920 110 L 820 110" fill="none" stroke="#0ea5e9" stroke-width="2" opacity="0.3" />
  <circle cx="820" cy="110" r="4" fill="#38bdf8" />

  <!-- Central Emblem (Shield) -->
  <g transform="translate(600, 105)" filter="url(#glow)">
    <!-- Shield Outer -->
    <path d="M 0 -45 L 38 -25 L 38 15 C 38 40 0 60 0 60 C 0 60 -38 40 -38 15 L -38 -25 Z" 
          fill="none" stroke="url(#primaryGrad)" stroke-width="3" />
    <!-- Shield Inner Core -->
    <path d="M 0 -35 L 28 -18 L 28 12 C 28 32 0 48 0 48 C 0 48 -28 32 -28 12 L -28 -18 Z" 
          fill="#0c4a6e" opacity="0.5" />
    <!-- Center Keyhole / Lock Icon -->
    <circle cx="0" cy="-3" r="7" fill="#38bdf8" />
    <path d="M -4 -1 L 4 -1 L 6 16 L -6 16 Z" fill="#38bdf8" />
  </g>

  <!-- Red-White Flag Ribbon Accent (Indonesia) -->
  <g transform="translate(600, 190)">
    <rect x="-35" y="0" width="35" height="4" fill="#ef4444" rx="2" />
    <rect x="0" y="0" width="35" height="4" fill="#ffffff" rx="2" />
  </g>

  <!-- Typography: Main Title -->
  <text x="600" y="240" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="38" 
        font-weight="800" 
        letter-spacing="2"
        fill="#f8fafc" 
        text-anchor="middle">
    PERPUSTAKAAN KEAMANAN SIBER
  </text>

  <!-- Typography: Subtitle Badge -->
  <text x="600" y="280" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="16" 
        font-weight="700" 
        letter-spacing="5"
        fill="url(#primaryGrad)" 
        text-anchor="middle">
    INDONESIA KNOWLEDGE HUB
  </text>

  <!-- Typography: Tagline -->
  <text x="600" y="325" 
        font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="15" 
        fill="#94a3b8" 
        text-anchor="middle">
    Pusat Pengetahuan, Panduan Praktik, dan Kurasi Sumber Daya Siber Berbasis Domain Industri
  </text>

  <!-- Bottom Border Glow Line -->
  <rect x="0" y="396" width="1200" height="4" fill="url(#primaryGrad)" />
</svg>
